services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stunning-travel-portal
    container_name: stunning-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - stunning-network

  web:
    image: nginx:alpine
    container_name: stunning-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - stunning-network

  db:
    image: mysql:8.0
    container_name: stunning-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - stunning-network

networks:
  stunning-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
