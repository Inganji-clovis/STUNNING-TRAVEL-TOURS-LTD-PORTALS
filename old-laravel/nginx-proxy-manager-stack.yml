services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: stunning-ssl-manager
    restart: unless-stopped
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - ./docker/npm/data:/data
      - ./docker/npm/letsencrypt:/etc/letsencrypt
    networks:
      - stunning-network

networks:
  stunning-network:
    external: true
    name: stunningtraveltoursltd_stunning-network
