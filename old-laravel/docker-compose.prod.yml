services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: stunning-travel-portal:prod
    container_name: stunning-app-prod
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www:ro
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    networks:
      - stunning-network
    environment:
      DB_HOST: db
      DB_CONNECTION: mysql
    env_file:
      - .env

  web:
    image: nginx:alpine
    container_name: stunning-web-prod
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - stunning-network

  db:
    image: mysql:8.0
    container_name: stunning-db-prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - dbdata_prod:/var/lib/mysql
    networks:
      - stunning-network

networks:
  stunning-network:
    driver: bridge

volumes:
  dbdata_prod:
    driver: local
